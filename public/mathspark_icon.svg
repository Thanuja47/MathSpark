<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <!-- Outer circle gradient: blue → teal -->
    <linearGradient id="circle-grad" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <!-- Flame gradient: yellow → deep orange -->
    <linearGradient id="flame-grad" x1="256" y1="80" x2="256" y2="260" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
    <!-- Infinity gradient: purple → orange -->
    <linearGradient id="inf-grad" x1="100" y1="310" x2="412" y2="400" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
  </defs>

  <!-- Outer circle ring -->
  <circle cx="256" cy="256" r="232" stroke="url(#circle-grad)" stroke-width="18" fill="white"/>

  <!-- Decorative corner dots and lines -->
  <rect x="255" y="28" width="14" height="14" rx="2" fill="#2563eb" opacity="0.9"/>
  <rect x="330" y="55" width="10" height="10" rx="1" fill="#10b981" opacity="0.8"/>
  <line x1="300" y1="90" x2="340" y2="55" stroke="#10b981" stroke-width="6" stroke-linecap="round" opacity="0.8"/>
  <rect x="60" y="330" width="10" height="10" rx="2" fill="#2563eb" opacity="0.7"/>
  <circle cx="256" cy="468" r="7" fill="#2563eb" opacity="0.9"/>

  <!-- Flame -->
  <path d="
    M256 90
    C256 90 230 130 228 165
    C226 185 238 195 238 195
    C232 175 244 158 252 148
    C252 148 246 185 258 208
    C264 218 270 210 272 200
    C278 175 268 150 268 140
    C276 158 282 182 278 202
    C292 188 296 165 290 145
    C300 165 296 200 278 218
    C268 228 258 228 252 228
    C238 228 220 215 218 195
    C214 165 232 120 256 90Z
  " fill="url(#flame-grad)"/>

  <!-- Infinity symbol -->
  <path d="
    M180 350
    C180 322 200 308 222 308
    C244 308 256 328 256 350
    C256 328 268 308 290 308
    C312 308 332 322 332 350
    C332 378 312 392 290 392
    C268 392 256 372 256 350
    C256 372 244 392 222 392
    C200 392 180 378 180 350Z
  " fill="url(#inf-grad)"/>

  <!-- Orange circle with + on infinity -->
  <circle cx="290" cy="350" r="32" fill="#ea580c"/>
  <line x1="290" y1="335" x2="290" y2="365" stroke="white" stroke-width="6" stroke-linecap="round"/>
  <line x1="275" y1="350" x2="305" y2="350" stroke="white" stroke-width="6" stroke-linecap="round"/>
</svg>
